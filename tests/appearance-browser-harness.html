<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SENTIENT OS Appearance browser harness</title>
    <link rel="stylesheet" href="/style.css">
    <script type="importmap">
      {"imports":{"three":"/three.module.js"}}
    </script>
    <style>
      body { background: #020409; color: #d8e7ff; }
      #synthetic-scene {
        position: fixed;
        inset: 0;
        display: grid;
        place-content: center;
        gap: 12px;
        color: #d8e7ff;
      }
      #synthetic-scene button { min-height: 40px; }
    </style>
  </head>
  <body>
    <main id="workspace" aria-label="Synthetic scene">
      <section id="synthetic-scene">
        <h1>Synthetic scene</h1>
        <p>Appearance preview and topology counters contain no activity data.</p>
        <output id="scene-state" aria-live="polite"></output>
      </section>
    </main>
    <nav id="application-navigation" class="application-navigation" aria-label="Application">
      <button id="application-menu-toggle" class="application-menu-toggle" type="button"
        aria-haspopup="menu" aria-controls="application-menu" aria-expanded="false">Menu</button>
      <ul id="application-menu" class="application-menu" role="menu"
        aria-labelledby="application-menu-toggle" hidden>
        <li role="none"><button id="library-open" class="application-menu-item" type="button"
          role="menuitem">Library</button></li>
        <li role="none"><button id="visual-settings-open" class="application-menu-item" type="button"
          role="menuitem" aria-controls="visual-settings-dialog">Appearance</button></li>
        <li role="none"><button id="workspace-open" class="application-menu-item" type="button"
          role="menuitem">Workspace</button></li>
        <li role="none"><button id="help-open" class="application-menu-item" type="button"
          role="menuitem" aria-controls="help-dialog">Help</button></li>
      </ul>
    </nav>
    <dialog id="help-dialog" class="help-dialog" aria-labelledby="help-title">
      <h2 id="help-title">Synthetic Help</h2>
      <button id="help-close" type="button">Close Help</button>
    </dialog>
    <div id="visual-settings-dialog"></div>
    <script type="module" src="/appearance-browser-harness.mjs"></script>
  </body>
</html>
