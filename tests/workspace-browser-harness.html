<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SENTIENT OS workspace browser harness</title>
    <link rel="stylesheet" href="/style.css">
    <style>
      .harness-banner {
        position: fixed;
        inset: 12px auto auto 12px;
        z-index: 20;
        max-width: min(520px, calc(100vw - 160px));
        padding: 8px 12px;
        border: 1px solid #3d8bff;
        background: #071121;
        color: #d8e7ff;
        font: 12px/1.5 monospace;
        pointer-events: none;
      }
      .hud-top { justify-content: flex-end; padding-right: 20px; }
    </style>
  </head>
  <body>
    <div class="harness-banner" id="harness-status" role="status">
      Loading synthetic workspace data...
    </div>
    <header class="hud hud-top">
      <button id="workspace-open" class="visual-settings-open workspace-open" type="button"
        aria-expanded="false">Workspace</button>
    </header>
    <main id="workspace" class="workspace" aria-label="Docked workspace">
      <section class="workspace-dock workspace-dock-left" data-workspace-dock="left" aria-label="Left dock"></section>
      <section class="workspace-dock workspace-dock-right" data-workspace-dock="right" aria-label="Right dock"></section>
      <section class="workspace-dock workspace-dock-bottom-left" data-workspace-dock="bottom-left" aria-label="Lower-left dock"></section>
      <section class="workspace-dock workspace-dock-bottom" data-workspace-dock="bottom" aria-label="Bottom dock"></section>
      <div class="workspace-assets" data-workspace-assets hidden>
        <aside class="hud-timeline" aria-label="Recent aggregate activity">
          <div id="timeline-content">
            <p id="timeline-description">Last 10 min · synthetic live aggregate · no session attribution</p>
            <canvas id="timeline" width="960" height="48" role="img" aria-label="Synthetic activity timeline"></canvas>
            <p id="timeline-state" role="status">Synthetic live coverage</p>
          </div>
          <button id="timeline-open" class="timeline-open" type="button"
            aria-label="Enlarge recent activity" aria-haspopup="dialog"
            aria-controls="timeline-dialog" aria-expanded="false"></button>
        </aside>
      </div>
    </main>
    <dialog id="timeline-dialog" class="stats-dialog timeline-dialog" aria-labelledby="timeline-title">
      <header class="stats-dialog-header">
        <h2 id="timeline-title">Recent activity · synthetic</h2>
        <button id="timeline-close" class="stats-close" type="button" aria-label="Close recent activity">Close</button>
      </header>
      <div id="timeline-dialog-content"></div>
    </dialog>
    <script type="module" src="/workspace-browser-harness.mjs"></script>
  </body>
</html>
